name: Docker Compose Validate

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'

jobs:
  validate:
    name: Validate Docker Compose Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate monitoring stack
        run: docker compose -f docker/compose/monitoring-stack.yml config --quiet

      - name: Validate wazuh stack
        run: docker compose -f docker/compose/wazuh-stack.yml config --quiet
